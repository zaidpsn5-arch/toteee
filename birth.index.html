<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مفاجأة عيد الميلاد ✨ Birthday Surprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root {
      --pink: #ff4da6;
      --pink-bright: #ff85c1;
      --pink-glow: rgba(255, 77, 166, 0.55);
      --bg-dark: #05020a;
      --card-bg: #ffffff;
      --text-dark: #2a1824;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: #fff;
      font-family: 'Cairo', 'Inter', sans-serif;
      user-select: none;
    }

    /* Canvases */
    #matrixCanvas,
    #particleCanvas,
    #starCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    #matrixCanvas {
      z-index: 1;
      transition: opacity 1.1s ease;
    }

    #particleCanvas {
      z-index: 2;
      transition: opacity 0.9s ease;
    }

    #starCanvas {
      z-index: 3;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    /* Floating Top Controls */
    .top-controls {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      direction: ltr;
    }

    .ctrl-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      background: rgba(20, 10, 28, 0.72);
      border: 1px solid rgba(255, 77, 166, 0.38);
      color: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Cairo', 'Inter', sans-serif;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 77, 166, 0.24);
      border-color: var(--pink-bright);
      transform: translateY(-1px);
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    /* Stage Containers */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Phase 2: Cute Bear Character Stage */
    .bear-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .stage.active .bear-wrapper {
      transform: scale(1);
    }

    .festive-title {
      font-family: 'Inter', 'Cairo', sans-serif;
      font-size: clamp(24px, 5vw, 42px);
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      text-shadow: 0 0 18px rgba(255, 77, 166, 0.6);
    }

    .festive-title span {
      display: inline-block;
      animation: bounceLetter 1.4s ease-in-out infinite;
    }

    @keyframes bounceLetter {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .bear-svg {
      width: min(230px, 55vw);
      height: auto;
      filter: drop-shadow(0 0 22px rgba(255, 133, 193, 0.4));
      animation: bearFloat 2.4s ease-in-out infinite;
    }

    @keyframes bearFloat {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      50% { transform: translateY(-10px) rotate(1.5deg); }
    }

    .flame {
      transform-origin: center bottom;
      animation: flicker 0.35s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      from { transform: scaleY(1) scaleX(1); opacity: 0.95; }
      to { transform: scaleY(1.18) scaleX(0.9); opacity: 1; }
    }

    /* Phase 3: 3D Interactive Greeting Card */
    .card-scene {
      width: min(680px, 94vw);
      height: min(460px, 72vh);
      perspective: 1800px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-book {
      position: relative;
      width: min(340px, 84vw);
      height: min(430px, 68vh);
      transform-style: preserve-3d;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), width 0.7s ease;
      cursor: pointer;
    }

    .card-book.is-open {
      width: min(660px, 92vw);
    }

    /* Closed Cover */
    .card-cover {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #ffffff 0%, #fff4f9 100%);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), 0 0 30px rgba(255, 77, 166, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      backface-visibility: hidden;
      transform-origin: left center;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
      z-index: 5;
      border: 2px solid rgba(255, 133, 193, 0.45);
    }

    .card-book.is-open .card-cover {
      transform: rotateY(-180deg);
      opacity: 0;
      pointer-events: none;
    }

    .cover-hint {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
      color: #c2367c;
      background: rgba(255, 77, 166, 0.12);
      padding: 6px 14px;
      border-radius: 999px;
      animation: pulseSoft 1.8s ease-in-out infinite;
    }

    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .heart-pulse {
      animation: heartBeat 1.2s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.14); }
      45% { transform: scale(0.98); }
      65% { transform: scale(1.1); }
    }

    /* Inside Card Spread */
    .card-inside {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #fffafd 0%, #fff0f6 100%);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 77, 166, 0.35);
      border: 2px solid rgba(255, 133, 193, 0.5);
      padding: clamp(14px, 3vw, 24px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.6s ease 0.25s, transform 0.6s ease 0.25s;
      color: var(--text-dark);
      overflow: hidden;
    }

    .card-book.is-open .card-inside {
      opacity: 1;
      transform: scale(1);
    }

    .card-message-box {
      background: #ffffff;
      border: 1.5px solid rgba(255, 77, 166, 0.28);
      border-radius: 14px;
      padding: 12px 16px;
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 14px rgba(255, 77, 166, 0.08);
    }

    .card-message-text {
      font-family: 'Playfair Display', 'Cairo', serif;
      font-size: clamp(14px, 2.5vw, 19px);
      font-weight: 600;
      color: #4a1c36;
      line-height: 1.55;
      direction: auto;
    }

    .card-photos-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(8px, 2vw, 16px);
      min-height: 0;
      align-items: stretch;
    }

    .photo-frame {
      background: #fff;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 8px 20px rgba(60, 20, 45, 0.16);
      border: 1px solid rgba(255, 77, 166, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      transition: transform 0.35s ease;
    }

    .photo-frame:hover {
      transform: translateY(-2px);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    .card-footer-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      direction: rtl;
    }

    .page-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .page-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 77, 166, 0.28);
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .page-dot.active {
      background: var(--pink);
      transform: scale(1.3);
    }

    .nav-pill {
      background: linear-gradient(135deg, #ff4da6, #e62e8a);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      font-family: 'Cairo', 'Inter', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 77, 166, 0.4);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .nav-pill.secondary {
      background: rgba(255, 77, 166, 0.12);
      color: #b52b70;
      box-shadow: none;
    }

    .nav-pill:hover {
      transform: translateY(-1px);
    }

    /* Phase 4: Heart Collage */
    .heart-collage-container {
      position: relative;
      width: min(520px, 92vw);
      height: min(460px, 68vh);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .collage-tile {
      position: absolute;
      width: clamp(50px, 11vw, 76px);
      height: clamp(50px, 11vw, 76px);
      border-radius: 12px;
      padding: 3px;
      background: linear-gradient(135deg, #ff85c1, #ff4da6);
      box-shadow: 0 0 18px rgba(255, 77, 166, 0.7), 0 6px 16px rgba(0, 0, 0, 0.5);
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.8s ease;
      cursor: pointer;
      overflow: hidden;
    }

    .collage-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 9px;
      display: block;
    }

    .collage-tile:hover {
      z-index: 25 !important;
      transform: translate(var(--tx), var(--ty)) scale(1.28) !important;
      box-shadow: 0 0 28px rgba(255, 133, 193, 0.95);
    }

    .collage-caption {
      margin-top: 14px;
      text-align: center;
      font-size: clamp(16px, 3vw, 22px);
      font-weight: 700;
      color: #ffd6eb;
      text-shadow: 0 0 16px rgba(255, 77, 166, 0.8);
      animation: pulseSoft 2.4s ease-in-out infinite;
    }

    /* Customization Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(6, 2, 12, 0.82);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      width: min(620px, 96vw);
      max-height: 88vh;
      background: #140b1d;
      border: 1px solid rgba(255, 77, 166, 0.4);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #fff;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 77, 166, 0.08);
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: #ff99cc;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .modal-body {
      padding: 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 13px;
      font-weight: 700;
      color: #ffc2e0;
    }

    .text-input, .textarea-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 77, 166, 0.3);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-family: 'Cairo', 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
    }

    .text-input:focus, .textarea-input:focus {
      border-color: var(--pink-bright);
      background: rgba(255, 255, 255, 0.09);
    }

    .upload-zone {
      border: 2px dashed rgba(255, 77, 166, 0.5);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      background: rgba(255, 77, 166, 0.06);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .upload-zone:hover {
      background: rgba(255, 77, 166, 0.12);
      border-color: var(--pink-bright);
    }

    .upload-zone input {
      display: none;
    }

    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .thumb-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-remove {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: none;
      font-size: 12px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .messages-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.25);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff4da6, #d91b7a);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Cairo', 'Inter', sans-serif;
      cursor: pointer;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Cairo', 'Inter', sans-serif;
      cursor: pointer;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(25, 12, 36, 0.92);
      border: 1px solid var(--pink);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Lock Screen (QR-Only Access) */
    .lock-screen {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: radial-gradient(circle at center, #1b0b24 0%, #05020a 75%);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .lock-screen.active {
      display: flex;
    }

    .lock-card {
      width: min(420px, 94vw);
      background: rgba(22, 11, 32, 0.9);
      border: 1.5px solid rgba(255, 77, 166, 0.45);
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.85), 0 0 40px rgba(255, 77, 166, 0.22);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .lock-icon {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(255, 77, 166, 0.14);
      border: 1.5px solid rgba(255, 77, 166, 0.5);
      display: grid;
      place-items: center;
      font-size: 30px;
      box-shadow: 0 0 24px rgba(255, 77, 166, 0.35);
    }

    .lock-card h2 {
      font-size: 20px;
      font-weight: 800;
      color: #ffd6eb;
    }

    .lock-card p {
      font-size: 13.5px;
      line-height: 1.7;
      color: #d7bed0;
    }

    .lock-input-row {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .owner-link-btn {
      background: none;
      border: none;
      color: rgba(255, 194, 224, 0.65);
      font-size: 12px;
      font-family: 'Cairo', 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 4px;
      text-decoration: underline;
    }

    .owner-link-btn:hover {
      color: #ff85c1;
    }

    /* QR Section inside Modal */
    .qr-box {
      background: rgba(255, 77, 166, 0.07);
      border: 1px solid rgba(255, 77, 166, 0.32);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .qr-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #ffd6eb;
    }

    .qr-preview-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding-top: 6px;
    }

    .qr-canvas-frame {
      background: #ffffff;
      padding: 12px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .qr-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    @media (max-width: 520px) {
      .card-book.is-open {
        height: min(470px, 74vh);
      }
      .card-photos-grid {
        gap: 8px;
      }
      .icon-btn {
        padding: 7px 11px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Background & Effect Canvases -->
  <canvas id="matrixCanvas"></canvas>
  <canvas id="particleCanvas"></canvas>
  <canvas id="starCanvas"></canvas>

  <!-- Top Controls -->
  <div class="top-controls">
    <div class="ctrl-group">
      <button class="icon-btn" id="soundBtn" type="button" title="تشغيل/كتم الموسيقى">🔇 موسيقى</button>
      <button class="icon-btn" id="replayBtn" type="button" title="إعادة العرض">🔄 إعادة</button>
    </div>
    <div class="ctrl-group">
      <button class="icon-btn" id="customizeBtn" type="button">⚙️ تخصيص الاسم والصور</button>
    </div>
  </div>

  <!-- Phase 2: Bear Birthday Stage -->
  <section class="stage" id="bearStage">
    <div class="bear-wrapper">
      <div class="festive-title" id="festiveTitle"></div>
      <svg class="bear-svg" viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
        <!-- Party Hat -->
        <polygon points="110,14 82,66 138,66" fill="#ff4da6" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="110" cy="14" r="8" fill="#ffd166"/>
        <line x1="94" y1="44" x2="126" y2="44" stroke="#ffd166" stroke-width="4" stroke-linecap="round"/>
        <!-- Ears -->
        <circle cx="66" cy="76" r="18" fill="#ffffff" stroke="#e5c8d8" stroke-width="3"/>
        <circle cx="66" cy="76" r="9" fill="#ffb3d9"/>
        <circle cx="154" cy="76" r="18" fill="#ffffff" stroke="#e5c8d8" stroke-width="3"/>
        <circle cx="154" cy="76" r="9" fill="#ffb3d9"/>
        <!-- Head -->
        <ellipse cx="110" cy="102" rx="48" ry="42" fill="#ffffff" stroke="#e5c8d8" stroke-width="3"/>
        <!-- Cheeks -->
        <ellipse cx="78" cy="110" rx="8" ry="5" fill="#ff99cc" opacity="0.7"/>
        <ellipse cx="142" cy="110" rx="8" ry="5" fill="#ff99cc" opacity="0.7"/>
        <!-- Eyes -->

  <script id="appScript">
    /* =========================================================================
       إعدادات افتراضية — يمكنك تعديلها مباشرة من الكود أو من زر "تخصيص" بالواجهة
       ========================================================================= */
    const ENCRYPTED_DATA = null;
    const DEFAULT_CONFIG = {
      name: "ANITA",
      greetingWords: ["HAPPY", "BIRTHDAY", "TO"],
      messages: [
        "Happy Birthday! Wishing you endless joy and love ❤️",
        "As long as you're smiling, I'm happy. Stay happy, my love ✨",
        "Every moment with you is my favorite memory 💖"
      ],
      photos: [], // إذا بقيت فارغة، يتم توليد بطاقات فنية جميلة تلقائياً حتى ترفع صورك
      qrLockEnabled: false,
      qrSecret: "surprise-2026",
      hostedUrl: ""
    };

    // تشفير وفك تشفير بسيط ومتوافق مع كل المتصفحات لحماية الصور داخل الكود
    function cipherString(str, key) {
      const bytes = new TextEncoder().encode(str);
      const kBytes = new TextEncoder().encode(key || "key");
      const out = new Uint8Array(bytes.length);
      let s = 0x9e3779b9;
      for (let i = 0; i < kBytes.length; i++) s = (s * 31 + kBytes[i]) >>> 0;
      for (let i = 0; i < bytes.length; i++) {
        s = (s * 1664525 + 1013904223) >>> 0;
        out[i] = bytes[i] ^ ((s >>> 16) & 0xff) ^ kBytes[i % kBytes.length];
      }
      let bin = "";
      for (let i = 0; i < out.length; i++) bin += String.fromCharCode(out[i]);
      return btoa(bin);
    }

    function decipherString(b64, key) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const kBytes = new TextEncoder().encode(key || "key");
      const out = new Uint8Array(bytes.length);
      let s = 0x9e3779b9;
      for (let i = 0; i < kBytes.length; i++) s = (s * 31 + kBytes[i]) >>> 0;
      for (let i = 0; i < bytes.length; i++) {
        s = (s * 1664525 + 1013904223) >>> 0;
        out[i] = bytes[i] ^ ((s >>> 16) & 0xff) ^ kBytes[i % kBytes.length];
      }
      return new TextDecoder().decode(out);
    }

    const STORAGE_KEY = "birthday_surprise_custom_v1";

    // توليد صور فنية لطيفة افتراضية (SVG Data URIs) عند عدم رفع صور بعد
    function createDemoPhoto(label, c1, c2, emoji) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
        </linearGradient></defs>
        <rect width="400" height="400" fill="url(#g)"/>
        <circle cx="200" cy="165" r="72" fill="rgba(255,255,255,0.22)"/>
        <text x="200" y="188" font-size="76" text-anchor="middle">${emoji}</text>
        <text x="200" y="295" font-size="24" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">${label}</text>
        <text x="200" y="330" font-size="15" font-family="sans-serif" fill="rgba(255,255,255,0.85)" text-anchor="middle">اضغط تخصيص لوضع صورك</text>
      </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    const DEMO_PHOTOS = [
      createDemoPhoto("Memory 1", "#ff4da6", "#7b2cbf", "🌸"),
      createDemoPhoto("Memory 2", "#ff758f", "#c9184a", "💖"),
      createDemoPhoto("Memory 3", "#f72585", "#4361ee", "✨"),
      createDemoPhoto("Memory 4", "#ff85a1", "#9d4edd", "🎂"),
      createDemoPhoto("Memory 5", "#fb6f92", "#ff006e", "🦋"),
      createDemoPhoto("Memory 6", "#e0aaff", "#c77dff", "💫")
    ];

    function loadConfig() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            name: parsed.name || DEFAULT_CONFIG.name,
            greetingWords: Array.isArray(parsed.greetingWords) && parsed.greetingWords.length ? parsed.greetingWords : [...DEFAULT_CONFIG.greetingWords],
            messages: Array.isArray(parsed.messages) && parsed.messages.length ? parsed.messages : [...DEFAULT_CONFIG.messages],
            photos: Array.isArray(parsed.photos) ? parsed.photos : [],
            qrLockEnabled: Boolean(parsed.qrLockEnabled),
            qrSecret: parsed.qrSecret || DEFAULT_CONFIG.qrSecret,
            hostedUrl: parsed.hostedUrl || ""
          };
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    }

    function saveConfig(cfg) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
      } catch (e) {
        showToast("تم التحديث للجلسة الحالية (الصور كبيرة للتخزين الدائم)");
      }
    }

    let config = loadConfig();
    function getActivePhotos() {
      return config.photos.length > 0 ? config.photos : DEMO_PHOTOS;
    }

    /* =========================================================================
       Toast & Web Audio Music Box
       ========================================================================= */
    const toastEl = document.getElementById("toast");
    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
    }

    let audioCtx = null;
    let musicPlaying = false;
    let musicLoopId = null;

    const MELODY = [
      [261.63, 0.35], [261.63, 0.25], [293.66, 0.55], [261.63, 0.55], [349.23, 0.55], [329.63, 1.0],
      [261.63, 0.35], [261.63, 0.25], [293.66, 0.55], [261.63, 0.55], [392.00, 0.55], [349.23, 1.0],
      [261.63, 0.35], [261.63, 0.25], [523.25, 0.55], [440.00, 0.55], [349.23, 0.55], [329.63, 0.55], [293.66, 0.9],
      [466.16, 0.35], [466.16, 0.25], [440.00, 0.55], [349.23, 0.55], [392.00, 0.55], [349.23, 1.1]
    ];

    function playNote(freq, dur) {
      if (!audioCtx || !musicPlaying) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur + 0.05);
    }

    function startMusic() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      musicPlaying = true;
      document.getElementById("soundBtn").textContent = "🔊 موسيقى";
      let idx = 0;
      clearTimeout(musicLoopId);
      function step() {
        if (!musicPlaying) return;
        const [freq, dur] = MELODY[idx % MELODY.length];
        playNote(freq, dur);
        idx++;
        musicLoopId = setTimeout(step, dur * 760);
      }
      step();
    }

    function stopMusic() {
      musicPlaying = false;
      clearTimeout(musicLoopId);
      document.getElementById("soundBtn").textContent = "🔇 موسيقى";
    }

    document.getElementById("soundBtn").addEventListener("click", () => {
      if (musicPlaying) stopMusic();
      else startMusic();
    });

    /* =========================================================================
       Canvas 1: Pink Matrix Rain
       ========================================================================= */
    const matrixCanvas = document.getElementById("matrixCanvas");
    const mCtx = matrixCanvas.getContext("2d");
    const particleCanvas = document.getElementById("particleCanvas");
    const pCtx = particleCanvas.getContext("2d");
    const starCanvas = document.getElementById("starCanvas");
    const sCtx = starCanvas.getContext("2d");

    let W = window.innerWidth;
    let H = window.innerHeight;
    let matrixDrops = [];
    const matrixChars = "HAPPYBIRTHDAYLOVE❤★01♥";
    const fontSize = 15;

    function resizeAll() {
      W = window.innerWidth;
      H = window.innerHeight;
      matrixCanvas.width = particleCanvas.width = starCanvas.width = W;
      matrixCanvas.height = particleCanvas.height = starCanvas.height = H;
      const cols = Math.ceil(W / fontSize);
      matrixDrops = Array.from({ length: cols }, () => Math.floor(Math.random() * -40));
      initStars();
    }

    /* =========================================================================
       Canvas 2: Particle Text & Heart Morphing
       ========================================================================= */
    let particles = [];
    const offscreen = document.createElement("canvas");
    const offCtx = offscreen.getContext("2d");

    function sampleTargetPoints(type, value) {
      offscreen.width = W;
      offscreen.height = H;
      offCtx.clearRect(0, 0, W, H);
      offCtx.fillStyle = "#ffffff";
      offCtx.textAlign = "center";
      offCtx.textBaseline = "middle";

      if (type === "heart") {
        const size = Math.min(W, H) * 0.34;
        const cx = W / 2;
        const cy = H / 2 + size * 0.08;
        offCtx.beginPath();
        for (let t = 0; t <= Math.PI * 2; t += 0.02) {
          const x = 16 * Math.pow(Math.sin(t), 3);
          const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
          const px = cx + (x / 17) * size;
          const py = cy + (y / 17) * size;
          if (t === 0) offCtx.moveTo(px, py);
          else offCtx.lineTo(px, py);
        }
        offCtx.closePath();
        offCtx.fill();
      } else {
        const len = value.length;
        const maxFont = len <= 2 ? Math.min(W, H) * 0.34 : Math.min(W * 0.78 / Math.max(len * 0.62, 1), H * 0.24);
        const fSize = Math.max(36, Math.min(180, maxFont));
        offCtx.font = `900 ${fSize}px 'Cairo', 'Inter', sans-serif`;
        offCtx.fillText(value, W / 2, H / 2);
      }

      const img = offCtx.getImageData(0, 0, W, H).data;
      const gap = W < 520 ? 5 : 6;
      const pts = [];
      for (let y = 0; y < H; y += gap) {
        for (let x = 0; x < W; x += gap) {
          if (img[(y * W + x) * 4 + 3] > 140) {
            pts.push({ x, y });
          }
        }
      }
      return pts;
    }

    function morphTo(type, value) {
      const targets = sampleTargetPoints(type, value);
      if (!targets.length) return;
      while (particles.length < targets.length) {
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          tx: W / 2,
          ty: H / 2,
          vx: 0,
          vy: 0,
          size: Math.random() * 2 + 1.8,
          alpha: 1
        });
      }
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (i < targets.length) {
          const t = targets[i];
          p.tx = t.x;
          p.ty = t.y;
          p.active = true;
        } else {
          p.tx = Math.random() * W;
          p.ty = Math.random() * H;
          p.active = false;
        }
      }
    }

    /* =========================================================================
       Canvas 3: Starry Night + Floating Mini Hearts
       ========================================================================= */
    let stars = [];
    let floatingHearts = [];

    function initStars() {
      stars = Array.from({ length: 130 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.4,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.03 + 0.01
      }));
      floatingHearts = Array.from({ length: 16 }, () => ({
        x: Math.random() * W,
        y: H + Math.random() * H,
        size: Math.random() * 10 + 8,
        speed: Math.random() * 0.7 + 0.35,
        alpha: Math.random() * 0.45 + 0.2
      }));
    }

    /* =========================================================================
       Animation Loop
       ========================================================================= */
    let animFrameId = null;
    let phase = 1; // 1 = matrix+particles, 2 = bear, 3 = card, 4 = collage

    function renderLoop() {
      // 1. Matrix Canvas
      if (phase === 1) {
        mCtx.fillStyle = "rgba(5, 2, 10, 0.14)";
        mCtx.fillRect(0, 0, W, H);
        mCtx.font = `bold ${fontSize}px monospace`;
        for (let i = 0; i < matrixDrops.length; i++) {
          const ch = matrixChars[Math.floor(Math.random() * matrixChars.length)];
          const x = i * fontSize;
          const y = matrixDrops[i] * fontSize;
          mCtx.fillStyle = Math.random() > 0.88 ? "#ffd6eb" : "#ff4da6";
          mCtx.fillText(ch, x, y);
          if (y > H && Math.random() > 0.975) matrixDrops[i] = 0;
          matrixDrops[i]++;
        }
      }

      // 2. Particle Canvas
      pCtx.clearRect(0, 0, W, H);
      if (phase === 1) {
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          if (!p.active) continue;
          p.x += (p.tx - p.x) * 0.14;
          p.y += (p.ty - p.y) * 0.14;
          pCtx.fillStyle = "#ff85c1";
          pCtx.shadowColor = "#ff4da6";
          pCtx.shadowBlur = 8;
          pCtx.beginPath();
          pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          pCtx.fill();
        }
        pCtx.shadowBlur = 0;
      }

      // 3. Star Canvas
      if (phase >= 2) {
        sCtx.clearRect(0, 0, W, H);
        for (const st of stars) {
          st.phase += st.speed;
          const a = 0.35 + 0.65 * Math.abs(Math.sin(st.phase));
          sCtx.fillStyle = `rgba(255, 255, 255, ${a})`;
          sCtx.beginPath();
          sCtx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
          sCtx.fill();
        }
        for (const fh of floatingHearts) {
          fh.y -= fh.speed;
          if (fh.y < -30) {
            fh.y = H + 20;
            fh.x = Math.random() * W;
          }
          sCtx.fillStyle = `rgba(255, 77, 166, ${fh.alpha})`;
          sCtx.font = `${fh.size}px sans-serif`;
          sCtx.fillText("♥", fh.x, fh.y);
        }
      }

      animFrameId = requestAnimationFrame(renderLoop);
    }

    /* =========================================================================
       Sequence Controller (Phases 1 -> 2 -> 3 -> 4)
       ========================================================================= */
    let sequenceTimers = [];
    function clearSequenceTimers() {
      sequenceTimers.forEach(t => clearTimeout(t));
      sequenceTimers = [];
    }

    function setStage(stageId) {
      document.querySelectorAll(".stage").forEach(el => el.classList.remove("active"));
      if (stageId) document.getElementById(stageId).classList.add("active");
    }

    function buildFestiveTitle() {
      const titleEl = document.getElementById("festiveTitle");
      titleEl.innerHTML = "";
      const colors = ["#ff4da6", "#ffd166", "#4cc9f0", "#ff85c1", "#80ed99", "#ffbe0b"];
      const text = "HAPPY BIRTHDAY";
      [...text].forEach((ch, idx) => {
        const sp = document.createElement("span");
        sp.textContent = ch === " " ? "\u00A0" : ch;
        sp.style.color = colors[idx % colors.length];
        sp.style.animationDelay = `${idx * 0.08}s`;
        titleEl.appendChild(sp);
      });
    }

    function startSequence() {
      clearSequenceTimers();
      phase = 1;
      particles = [];
      matrixCanvas.style.opacity = "1";
      particleCanvas.style.opacity = "1";
      starCanvas.style.opacity = "0";
      setStage(null);

      // Reset card state
      currentPage = 0;
      document.getElementById("cardBook").classList.remove("is-open");
      document.getElementById("coverRecipient").textContent = `إلى ${config.name} 💖`;
      buildFestiveTitle();

      const steps = [
        { type: "text", val: "3", delay: 200 },
        { type: "text", val: "2", delay: 1150 },
        { type: "text", val: "1", delay: 2100 }
      ];

      let t = 3050;
      config.greetingWords.forEach(w => {
        steps.push({ type: "text", val: w.trim(), delay: t });
        t += 1250;
      });
      steps.push({ type: "text", val: config.name, delay: t });
      t += 1450;
      steps.push({ type: "heart", val: "♥", delay: t });
      t += 1600;

      steps.forEach(s => {
        sequenceTimers.push(setTimeout(() => morphTo(s.type, s.val), s.delay));
      });

      // Phase 2: Starry sky + Bear
      sequenceTimers.push(setTimeout(() => {
        phase = 2;
        matrixCanvas.style.opacity = "0";
        particleCanvas.style.opacity = "0";
        starCanvas.style.opacity = "1";
        setStage("bearStage");
      }, t));

      // Phase 3: Greeting Card
      sequenceTimers.push(setTimeout(() => {
        phase = 3;
        renderCardPage();
        setStage("cardStage");
      }, t + 3300));
    }

    /* =========================================================================
       Phase 3: Card Logic
       ========================================================================= */
    let currentPage = 0;
    const cardBook = document.getElementById("cardBook");
    const cardMessageText = document.getElementById("cardMessageText");
    const cardPhotoLeft = document.getElementById("cardPhotoLeft");
    const cardPhotoRight = document.getElementById("cardPhotoRight");
    const pageDots = document.getElementById("pageDots");
    const prevPageBtn = document.getElementById("prevPageBtn");
    const nextPageBtn = document.getElementById("nextPageBtn");

    function renderCardPage() {
      const msgs = config.messages;
      const photos = getActivePhotos();
      const total = msgs.length;
      if (currentPage >= total) currentPage = total - 1;
      if (currentPage < 0) currentPage = 0;

      cardMessageText.textContent = msgs[currentPage];
      const leftIdx = (currentPage * 2) % photos.length;
      const rightIdx = (currentPage * 2 + 1) % photos.length;
      cardPhotoLeft.src = photos[leftIdx];
      cardPhotoRight.src = photos[rightIdx];

      pageDots.innerHTML = "";
      for (let i = 0; i < total; i++) {
        const d = document.createElement("span");
        d.className = "page-dot" + (i === currentPage ? " active" : "");
        pageDots.appendChild(d);
      }

      prevPageBtn.style.visibility = currentPage === 0 ? "hidden" : "visible";
      nextPageBtn.textContent = currentPage === total - 1 ? "مفاجأة القلب 💖" : "التالي ✨";
    }

    document.getElementById("cardCover").addEventListener("click", () => {
      cardBook.classList.add("is-open");
      if (!musicPlaying) startMusic();
    });

    prevPageBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (currentPage > 0) {
        currentPage--;
        renderCardPage();
      }
    });

    nextPageBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (currentPage < config.messages.length - 1) {
        currentPage++;
        renderCardPage();
      } else {
        launchHeartCollage();
      }
    });

    /* =========================================================================
       Phase 4: Glowing Heart Photo Collage
       ========================================================================= */
    function launchHeartCollage() {
      phase = 4;
      setStage("collageStage");
      const container = document.getElementById("heartCollage");
      const caption = document.getElementById("collageCaption");
      container.innerHTML = "";
      caption.textContent = `Happy Birthday, ${config.name} ❤️`;

      const photos = getActivePhotos();
      const numTiles = 16;
      const rect = container.getBoundingClientRect();
      const scale = Math.min(rect.width, rect.height) / 36;

      for (let i = 0; i < numTiles; i++) {
        const t = (i / numTiles) * Math.PI * 2;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        const tx = hx * scale;
        const ty = hy * scale;

        const tile = document.createElement("div");
        tile.className = "collage-tile";
        tile.style.setProperty("--tx", `${tx}px`);
        tile.style.setProperty("--ty", `${ty}px`);
        tile.style.transform = "translate(0px, 0px) scale(0.2)";
        tile.style.opacity = "0";
        tile.style.zIndex = String(10 + (i % 5));

        const img = document.createElement("img");
        img.src = photos[i % photos.length];
        img.alt = `Photo ${i + 1}`;
        tile.appendChild(img);
        container.appendChild(tile);

        setTimeout(() => {
          tile.style.opacity = "1";
          tile.style.transform = `translate(${tx}px, ${ty}px) scale(1)`;
        }, 80 + i * 55);
      }

      // Center hero photo inside heart
      const centerTile = document.createElement("div");
      centerTile.className = "collage-tile";
      centerTile.style.width = "clamp(64px, 14vw, 94px)";
      centerTile.style.height = "clamp(64px, 14vw, 94px)";
      centerTile.style.setProperty("--tx", "0px");
      centerTile.style.setProperty("--ty", "-4px");
      centerTile.style.transform = "translate(0px, 0px) scale(0.2)";
      centerTile.style.opacity = "0";
      centerTile.style.zIndex = "20";
      const cImg = document.createElement("img");
      cImg.src = photos[0];
      cImg.alt = "Main Photo";
      centerTile.appendChild(cImg);
      container.appendChild(centerTile);
      setTimeout(() => {
        centerTile.style.opacity = "1";
        centerTile.style.transform = "translate(0px, -4px) scale(1)";
      }, 80 + numTiles * 55);
    }

    /* =========================================================================
       Customization Modal Logic (Name, Messages, Photo Upload & Export)
       ========================================================================= */
    const customModal = document.getElementById("customModal");
    const nameInput = document.getElementById("nameInput");
    const greetingWordsInput = document.getElementById("greetingWordsInput");
    const messagesList = document.getElementById("messagesList");
    const thumbGrid = document.getElementById("thumbGrid");
    const photoUploadInput = document.getElementById("photoUploadInput");

    let draftMessages = [];
    let draftPhotos = [];

    function renderModalState() {
      nameInput.value = config.name;
      greetingWordsInput.value = config.greetingWords.join(", ");
      draftMessages = [...config.messages];
      draftPhotos = [...config.photos];
      renderDraftMessages();
      renderDraftThumbs();
    }

    function renderDraftMessages() {
      messagesList.innerHTML = "";
      draftMessages.forEach((msg, idx) => {
        const row = document.createElement("div");
        row.className = "msg-row";
        const inp = document.createElement("input");
        inp.className = "text-input";
        inp.value = msg;
        inp.placeholder = `رسالة الصفحة ${idx + 1}`;
        inp.addEventListener("input", (e) => { draftMessages[idx] = e.target.value; });
        row.appendChild(inp);

        if (draftMessages.length > 1) {
          const del = document.createElement("button");
          del.type = "button";
          del.className = "btn-secondary";
          del.textContent = "حذف";
          del.addEventListener("click", () => {
            draftMessages.splice(idx, 1);
            renderDraftMessages();
          });
          row.appendChild(del);
        }
        messagesList.appendChild(row);
      });
    }

    function renderDraftThumbs() {
      thumbGrid.innerHTML = "";
      draftPhotos.forEach((src, idx) => {
        const item = document.createElement("div");
        item.className = "thumb-item";
        const img = document.createElement("img");
        img.src = src;
        const rm = document.createElement("button");
        rm.type = "button";
        rm.className = "thumb-remove";
        rm.textContent = "×";
        rm.addEventListener("click", () => {
          draftPhotos.splice(idx, 1);
          renderDraftThumbs();
        });
        item.appendChild(img);
        item.appendChild(rm);
        thumbGrid.appendChild(item);
      });
    }

    function compressImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 720;
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              const ratio = Math.min(maxDim / width, maxDim / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }
            const c = document.createElement("canvas");
            c.width = width;
            c.height = height;
            c.getContext("2d").drawImage(img, 0, 0, width, height);
            resolve(c.toDataURL("image/jpeg", 0.82));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    photoUploadInput.addEventListener("change", async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      for (const f of files) {
        const dataUrl = await compressImageFile(f);
        draftPhotos.push(dataUrl);
      }
      renderDraftThumbs();
      photoUploadInput.value = "";
      showToast(`تمت إضافة ${files.length} صورة ✨`);
    });

    document.getElementById("addMsgBtn").addEventListener("click", () => {
      draftMessages.push("Happy Birthday! ❤️");
      renderDraftMessages();
    });

    document.getElementById("customizeBtn").addEventListener("click", () => {
      renderModalState();
      customModal.classList.add("open");
    });

    document.getElementById("closeModalBtn").addEventListener("click", () => {
      customModal.classList.remove("open");
    });

    document.getElementById("saveCustomBtn").addEventListener("click", () => {
      const newName = nameInput.value.trim() || DEFAULT_CONFIG.name;
      const words = greetingWordsInput.value.split(",").map(s => s.trim()).filter(Boolean);
      const msgs = draftMessages.map(m => m.trim()).filter(Boolean);
      config = {
        name: newName,
        greetingWords: words.length ? words : [...DEFAULT_CONFIG.greetingWords],
        messages: msgs.length ? msgs : [...DEFAULT_CONFIG.messages],
        photos: [...draftPhotos]
      };
      saveConfig(config);
      customModal.classList.remove("open");
      showToast("تم حفظ التعديلات وتشغيل المفاجأة!");
      startSequence();
    });

    document.getElementById("resetDefaultBtn").addEventListener("click", () => {
      config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      renderModalState();
      showToast("تمت استعادة الإعدادات الافتراضية");
    });

    document.getElementById("downloadHtmlBtn").addEventListener("click", () => {
      const tempCfg = {
        name: nameInput.value.trim() || config.name,
        greetingWords: greetingWordsInput.value.split(",").map(s => s.trim()).filter(Boolean),
        messages: draftMessages.map(m => m.trim()).filter(Boolean),
        photos: [...draftPhotos]
      };
      const htmlDoc = "<!DOCTYPE html>\n" + document.documentElement.outerHTML.replace(
        /const DEFAULT_CONFIG = \{[\s\S]*?\};/,
        `const DEFAULT_CONFIG = ${JSON.stringify(tempCfg, null, 2)};`
      );
      const blob = new Blob([htmlDoc], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `birthday-for-${tempCfg.name.replace(/\s+/g, "-").toLowerCase()}.html`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("تم تحميل ملف HTML مدمجاً بالاسم والصور!");
    });

    document.getElementById("replayBtn").addEventListener("click", () => {
      startSequence();
    });

    /* =========================================================================
       QR Code Generation & Access Lock
       ========================================================================= */
    const lockScreen = document.getElementById("lockScreen");
    const qrLockToggle = document.getElementById("qrLockToggle");
    const qrSettingsFields = document.getElementById("qrSettingsFields");
    const qrSecretInput = document.getElementById("qrSecretInput");
    const hostedUrlInput = document.getElementById("hostedUrlInput");
    const qrCanvas = document.getElementById("qrCanvas");
    const qrLinkPreview = document.getElementById("qrLinkPreview");
    const manualKeyInput = document.getElementById("manualKeyInput");
    const lockErrorMsg = document.getElementById("lockErrorMsg");

    let isUnlocked = false;

    function getProtectedUrl() {
      const base = (hostedUrlInput.value.trim() || window.location.href.split("#")[0].split("?")[0]);
      const sec = qrSecretInput.value.trim() || "surprise-2026";
      return `${base}#access=${encodeURIComponent(sec)}`;
    }

    function updateQrPreview() {
      const show = qrLockToggle.checked;
      qrSettingsFields.style.display = show ? "flex" : "none";
      if (!show) return;
      const fullUrl = getProtectedUrl();
      qrLinkPreview.textContent = fullUrl;
      if (window.QRCode && typeof window.QRCode.toCanvas === "function") {
        window.QRCode.toCanvas(qrCanvas, fullUrl, {
          width: 190,
          margin: 2,
          color: { dark: "#140b1d", light: "#ffffff" }
        }, () => {});
      }
    }

    qrLockToggle.addEventListener("change", updateQrPreview);
    qrSecretInput.addEventListener("input", updateQrPreview);
    hostedUrlInput.addEventListener("input", updateQrPreview);

    document.getElementById("genSecretBtn").addEventListener("click", () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
      let code = "QR-";
      for (let i = 0; i < 10; i++) code += chars[Math.floor(Math.random() * chars.length)];
      qrSecretInput.value = code;
      updateQrPreview();
    });

    document.getElementById("downloadQrBtn").addEventListener("click", () => {
      const url = qrCanvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url;
      a.download = `qr-code-${(nameInput.value.trim() || config.name).replace(/\s+/g, "-")}.png`;
      a.click();
      showToast("تم تحميل صورة الباركود!");
    });

    document.getElementById("copyQrLinkBtn").addEventListener("click", () => {
      const text = getProtectedUrl();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("تم نسخ الرابط المحمي!")).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    });

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); showToast("تم نسخ الرابط المحمي!"); } catch (e) {}
      document.body.removeChild(ta);
    }

    // Hook into modal open to populate QR fields
    const origRenderModalState = renderModalState;
    renderModalState = function() {
      origRenderModalState();
      qrLockToggle.checked = Boolean(config.qrLockEnabled);
      qrSecretInput.value = config.qrSecret || "surprise-2026";
      hostedUrlInput.value = config.hostedUrl || "";
      updateQrPreview();
    };

    // Override saveCustomBtn to persist QR settings
    const oldSaveBtn = document.getElementById("saveCustomBtn");
    const newSaveBtn = oldSaveBtn.cloneNode(true);
    oldSaveBtn.parentNode.replaceChild(newSaveBtn, oldSaveBtn);
    newSaveBtn.addEventListener("click", () => {
      const newName = nameInput.value.trim() || DEFAULT_CONFIG.name;
      const words = greetingWordsInput.value.split(",").map(s => s.trim()).filter(Boolean);
      const msgs = draftMessages.map(m => m.trim()).filter(Boolean);
      config = {
        name: newName,
        greetingWords: words.length ? words : [...DEFAULT_CONFIG.greetingWords],
        messages: msgs.length ? msgs : [...DEFAULT_CONFIG.messages],
        photos: [...draftPhotos],
        qrLockEnabled: qrLockToggle.checked,
        qrSecret: qrSecretInput.value.trim() || "surprise-2026",
        hostedUrl: hostedUrlInput.value.trim()
      };
      saveConfig(config);
      customModal.classList.remove("open");
      isUnlocked = true;
      lockScreen.classList.remove("active");
      showToast("تم حفظ التعديلات وتشغيل المفاجأة!");
      startSequence();
    });

    // Override downloadHtmlBtn to encrypt payload when QR lock is enabled
    const oldDlBtn = document.getElementById("downloadHtmlBtn");
    const newDlBtn = oldDlBtn.cloneNode(true);
    oldDlBtn.parentNode.replaceChild(newDlBtn, oldDlBtn);
    newDlBtn.addEventListener("click", () => {
      const lockOn = qrLockToggle.checked;
      const sec = qrSecretInput.value.trim() || "surprise-2026";
      const tempCfg = {
        name: nameInput.value.trim() || config.name,
        greetingWords: greetingWordsInput.value.split(",").map(s => s.trim()).filter(Boolean),
        messages: draftMessages.map(m => m.trim()).filter(Boolean),
        photos: [...draftPhotos],
        qrLockEnabled: lockOn,
        qrSecret: sec,
        hostedUrl: hostedUrlInput.value.trim()
      };

      let htmlDoc = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      if (lockOn) {
        const encryptedPayload = cipherString(JSON.stringify(tempCfg), sec);
        const strippedCfg = {
          name: "Locked",
          greetingWords: ["LOCKED"],
          messages: ["Locked"],
          photos: [],
          qrLockEnabled: true,
          qrSecret: "",
          hostedUrl: tempCfg.hostedUrl
        };
        htmlDoc = htmlDoc.replace(/const ENCRYPTED_DATA = (null|"[^"]*");/, `const ENCRYPTED_DATA = "${encryptedPayload}";`);
        htmlDoc = htmlDoc.replace(/const DEFAULT_CONFIG = \{[\s\S]*?\};/, `const DEFAULT_CONFIG = ${JSON.stringify(strippedCfg, null, 2)};`);
      } else {
        htmlDoc = htmlDoc.replace(/const ENCRYPTED_DATA = (null|"[^"]*");/, `const ENCRYPTED_DATA = null;`);
        htmlDoc = htmlDoc.replace(/const DEFAULT_CONFIG = \{[\s\S]*?\};/, `const DEFAULT_CONFIG = ${JSON.stringify(tempCfg, null, 2)};`);
      }

      const blob = new Blob([htmlDoc], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `birthday-for-${tempCfg.name.replace(/\s+/g, "-").toLowerCase()}.html`;
      a.click();
      URL.revokeObjectURL(url);
      showToast(lockOn ? "تم تحميل الملف مشفراً ومقفولاً بالباركود!" : "تم تحميل ملف HTML مدمجاً بالاسم والصور!");
    });

    function getUrlAccessKey() {
      const hashMatch = window.location.hash.match(/access=([^&]+)/);
      if (hashMatch) return decodeURIComponent(hashMatch[1]);
      const queryMatch = window.location.search.match(/access=([^&]+)/);
      if (queryMatch) return decodeURIComponent(queryMatch[1]);
      return null;
    }

    function tryUnlockWithKey(key) {
      if (!key) return false;
      if (ENCRYPTED_DATA) {
        try {
          const decrypted = JSON.parse(decipherString(ENCRYPTED_DATA, key));
          if (decrypted && decrypted.name && Array.isArray(decrypted.messages)) {
            config = decrypted;
            isUnlocked = true;
            lockScreen.classList.remove("active");
            return true;
          }
        } catch (e) {
          return false;
        }
        return false;
      }
      if (key === config.qrSecret) {
        isUnlocked = true;
        lockScreen.classList.remove("active");
        return true;
      }
      return false;
    }

    document.getElementById("manualUnlockBtn").addEventListener("click", () => {
      const k = manualKeyInput.value.trim();
      if (tryUnlockWithKey(k)) {
        lockErrorMsg.style.display = "none";
        startSequence();
      } else {
        lockErrorMsg.style.display = "block";
      }
    });

    document.getElementById("ownerOpenModalBtn").addEventListener("click", () => {
      renderModalState();
      customModal.classList.add("open");
    });

    /* =========================================================================
       Boot
       ========================================================================= */
    window.addEventListener("resize", resizeAll);
    window.addEventListener("load", () => {
      resizeAll();
      renderLoop();
      const urlKey = getUrlAccessKey();
      if (ENCRYPTED_DATA || config.qrLockEnabled) {
        if (tryUnlockWithKey(urlKey)) {
          startSequence();
        } else {
          lockScreen.classList.add("active");
        }
      } else {
        isUnlocked = true;
        startSequence();
      }
    });
  </script>
</body>
</html>
